repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace # Removes extra spaces at the end of lines
      - id: end-of-file-fixer # Ensures files end with a newline
      - id: check-yaml # Validates your YAML syntax (for GitHub Actions)
      - id: check-added-large-files # Prevents you from accidentally pushing 27MB weights!
        args: ["--maxkb=5000"] # Blocks files larger than 5MB

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black # Automatically formats your Python code to look pro
