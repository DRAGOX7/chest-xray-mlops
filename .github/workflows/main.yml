name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Updated to v4 for Node.js 24 support
      - name: Checkout code
        uses: actions/checkout@v4

      # Updated to v5 for Node.js 24 support
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx torch torchvision

      # --- CRITICAL: Download weights so pytest doesn't crash ---
      - name: Download Model Weights for Testing 📥
        run: |
          curl -L -o best_densenet121.pth "https://github.com/DRAGOX7/chest-xray-mlops/releases/download/v1.0.0/best_densenet121.pth"
      # ---------------------------------------------------------

      - name: Run automated tests 🧪
        run: pytest test_app.py

      # Updated to v2 for Node.js 24 support
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Container Registry
        run: az acr login --name aljafunique123

      - name: Build and Push Docker Image
        run: |
          docker build -t aljafunique123.azurecr.io/nih-chest-xray-app:${{ github.sha }} .
          docker push aljafunique123.azurecr.io/nih-chest-xray-app:${{ github.sha }}

      - name: Deploy to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aljaf-xray-final'
          images: 'aljafunique123.azurecr.io/nih-chest-xray-app:${{ github.sha }}'
