name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      # --- NEW TESTING PHASE ---
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14' # Matches your Docker image
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx torch torchvision  # Required for your new tests

      - name: Run automated tests 🧪
        run: pytest test_app.py
      # --------------------------
      # --- NEW: Download weights for the test phase ---
      - name: Download Model Weights for Testing 📥
        run: |
          curl -L -o best_densenet121.pth "https://github.com/DRAGOX7/chest-xray-mlops/releases/download/v1.0.0/best_densenet121.pth"
      # -----------------------------------------------

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}    
    
      - name: Log in to Container Registry
        run: az acr login --name aljafunique123

      - name: Build and Push Docker Image
        run: |
          docker build -t aljafunique123.azurecr.io/nih-chest-xray-app:${{ github.sha }} .
          docker push aljafunique123.azurecr.io/nih-chest-xray-app:${{ github.sha }}

      - name: Deploy to Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'aljaf-xray-final'
          images: 'aljafunique123.azurecr.io/nih-chest-xray-app:${{ github.sha }}'
